# Optional fallback for offline work. The primary target is Neo4j AuraDB Free (D013);
# this local Community-edition instance is a drop-in swap (see .env.example) when
# there's no network, or as a scratch DB you can freely `--clear`.
services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # browser UI
      - "7687:7687" # bolt (driver connections)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-labgo-local-dev}
      # Small commit-and-forget dataset (httpx: ~1.3k nodes) — defaults are plenty.
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-labgo-local-dev}", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  neo4j_data:
